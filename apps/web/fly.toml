# Fly.io deployment for the Stacks web app (Machines v2 schema).
# Compatible with the Fly Web UI's "Launch from GitHub" parser.
# Co-locate in the same region as the game server.

app = "stacks-web"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    # NEXT_PUBLIC_* values must be present at `next build` time so they get
    # baked into the client bundle. All public-by-design.
    NEXT_PUBLIC_SUPABASE_URL = "https://nytqqmucwyizhgsiafnl.supabase.co"
    NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55dHFxbXVjd3lpemhnc2lhZm5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTA0NDQsImV4cCI6MjA5MzY2NjQ0NH0.mkUtDRJr_5rBW4-OLtXn2U7_ywVmk1R-SpYUzPG6zJk"
    NEXT_PUBLIC_SOLANA_NETWORK = "devnet"
    NEXT_PUBLIC_SOLANA_RPC = "https://api.devnet.solana.com"
    NEXT_PUBLIC_VAULT_PROGRAM_ID = "11111111111111111111111111111111"
    NEXT_PUBLIC_USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_SUPABASE_URL = "https://nytqqmucwyizhgsiafnl.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55dHFxbXVjd3lpemhnc2lhZm5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTA0NDQsImV4cCI6MjA5MzY2NjQ0NH0.mkUtDRJr_5rBW4-OLtXn2U7_ywVmk1R-SpYUzPG6zJk"
  NEXT_PUBLIC_SOLANA_NETWORK = "devnet"
  NEXT_PUBLIC_SOLANA_RPC = "https://api.devnet.solana.com"
  NEXT_PUBLIC_VAULT_PROGRAM_ID = "11111111111111111111111111111111"
  NEXT_PUBLIC_USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"

# Modern v2 HTTP service. Auto-stop when idle keeps cost at $0 for F&F.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
