# fly.toml app configuration file generated for stacks-game on 2026-05-07T10:59:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'stacks-game'
primary_region = 'iad'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  ACTION_TIMEOUT_MS = '20000'
  LOG_LEVEL = 'info'
  MAX_CONNECTIONS = '50000'
  MAX_TABLES_PER_SHARD = '500'
  PORT = '4000'
  SHARD_ID = '0'
  TIME_BANK_MS = '30000'
  TOTAL_SHARDS = '1'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[[metrics]]
  port = 4000
  path = '/metrics'
