# Fly.io deployment for the Stacks game server (Machines v2 schema).
# Compatible with the Fly Web UI's "Launch from GitHub" parser.

app = "stacks-game"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  LOG_LEVEL = "info"
  ACTION_TIMEOUT_MS = "20000"
  TIME_BANK_MS = "30000"
  MAX_TABLES_PER_SHARD = "500"
  MAX_CONNECTIONS = "50000"
  TOTAL_SHARDS = "1"
  SHARD_ID = "0"

# WebSockets work transparently through [http_service] (Fly upgrades the
# connection on /). For F&F, auto-stop when idle keeps cost at $0.
[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[metrics]
  port = 4000
  path = "/metrics"

# F&F sizing — bump to performance-2x / 4gb when you outgrow this.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
