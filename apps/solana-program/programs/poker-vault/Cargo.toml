[package]
name = "poker_vault"
version = "0.1.0"
description = "USDC custody vault for Stacks Poker — provably solvent on-chain"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "poker_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "1.18"
